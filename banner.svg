<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 428" width="1200" height="428" role="img" aria-label="A New York subway sign reading Shimmy Kohn, Uptown and The App Store, above a departures board listing iska, mySportly, custom software for businesses, and live GitHub activity.">
  <!-- Generated from banner.template.svg by scripts/update-banner.mjs. Edit the template, not banner.svg. -->
  <defs>
    <clipPath id="sign"><rect width="1200" height="428" rx="10"/></clipPath>
    <clipPath id="s1"><rect x="900" y="216" width="244" height="34"/></clipPath>
    <clipPath id="s2"><rect x="900" y="254" width="244" height="34"/></clipPath>
    <clipPath id="s3"><rect x="900" y="292" width="244" height="34"/></clipPath>
    <clipPath id="tunnel"><rect x="0" y="378" width="1200" height="50"/></clipPath>
  </defs>

  <style>
    .sans { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .name { font-weight: 700; font-size: 66px; letter-spacing: -1.5px; fill: #fff; }
    .dest { font-weight: 400; font-size: 27px; fill: #fff; }
    .bullet { font-weight: 700; font-size: 44px; text-anchor: middle; }
    .led { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; font-size: 22px; fill: #ffb000; }
    .dim { fill: #b37b00; }
    .hot { fill: #ffd25e; }
    .mini { font-weight: 700; font-size: 17px; text-anchor: middle; }
    .right { text-anchor: end; }

    /* the status column flips between two readings, like a countdown clock */
    .flip { animation: flip 9s steps(1, end) infinite; }
    .f2 { animation-delay: -3s; }
    .f3 { animation-delay: -6s; }
    @keyframes flip { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-38px); } }

    .blink { animation: blink 1.6s steps(1, end) infinite; }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .15; } }

    /* a train pulls in, waits at the platform, and leaves */
    .train { animation: run 16s cubic-bezier(.45, 0, .2, 1) infinite; }
    @keyframes run {
      0%   { transform: translateX(-640px); }
      28%  { transform: translateX(300px); }
      62%  { transform: translateX(300px); }
      100% { transform: translateX(1280px); }
    }
    .doors { animation: doors 16s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes doors {
      0%, 31% { transform: scaleX(1); }
      35%, 56% { transform: scaleX(.12); }
      60%, 100% { transform: scaleX(1); }
    }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#sign)">
    <!-- the sign -->
    <rect width="1200" height="428" fill="#0c0c0c"/>
    <rect x="0" y="30" width="1200" height="5" fill="#fff"/>

    <circle cx="92" cy="112" r="38" fill="#fccc0a"/>
    <text class="sans bullet" x="92" y="128" fill="#0c0c0c">S</text>
    <circle cx="180" cy="112" r="38" fill="#0039a6"/>
    <text class="sans bullet" x="180" y="128" fill="#fff">K</text>

    <text class="sans name" x="240" y="124">Shimmy Kohn</text>
    <text class="sans dest" x="243" y="166">Uptown &amp; The App Store</text>

    <!-- exit arrow, top right -->
    <g transform="translate(1066 84)" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="square">
      <path d="M0 56 L56 0"/><path d="M14 0 H56 V42"/>
    </g>
    <text class="sans dest right" x="1046" y="124">iska.app</text>

    <!-- departures board -->
    <rect x="40" y="200" width="1120" height="170" rx="4" fill="#000" stroke="#262626" stroke-width="2"/>
    <g stroke="#161616" stroke-width="1">
      <path d="M56 252 H1144"/><path d="M56 290 H1144"/>
    </g>
    <path d="M56 328 H1144" stroke="#3a2a00" stroke-width="2"/>

    <circle cx="76" cy="233" r="13" fill="#00933c"/><text class="sans mini" x="76" y="239" fill="#fff">1</text>
    <text class="led" x="104" y="241">iska</text>
    <text class="led dim" x="170" y="241">client, session and payment tracking</text>

    <circle cx="76" cy="271" r="13" fill="#ff6319"/><text class="sans mini" x="76" y="277" fill="#fff">2</text>
    <text class="led" x="104" y="279">mySportly</text>
    <text class="led dim" x="236" y="279">live TV for iPhone and iPad</text>

    <circle cx="76" cy="309" r="13" fill="#b933ad"/><text class="sans mini" x="76" y="315" fill="#fff">3</text>
    <text class="led" x="104" y="317">Custom software</text>
    <text class="led dim" x="315" y="317">automation and tools for businesses</text>

    <g clip-path="url(#s1)"><g class="flip">
      <text class="led right" x="1120" y="241">BUILDING</text>
      <text class="led right" x="1120" y="279">NOW BOARDING</text>
    </g></g>
    <circle class="blink" cx="1134" cy="233" r="5" fill="#ffb000"/>

    <g clip-path="url(#s2)"><g class="flip f2">
      <text class="led right" x="1136" y="279">ARRIVED</text>
      <text class="led right" x="1136" y="317">OPEN SOURCE</text>
    </g></g>

    <g clip-path="url(#s3)"><g class="flip f3">
      <text class="led right" x="1136" y="317">IN SERVICE</text>
      <text class="led right" x="1136" y="355">ON REQUEST</text>
    </g></g>

    <!-- live service status: GitHub activity, refreshed by a scheduled job -->
    <circle class="blink" cx="76" cy="348" r="6" fill="#ee352e"/>
    <text class="led" x="104" y="356"><tspan class="dim">LAST 24H </tspan><tspan class="hot">88</tspan><tspan class="dim"> · 7 DAYS </tspan><tspan class="hot">257</tspan><tspan class="dim"> · YEAR </tspan><tspan class="hot">1,162</tspan><tspan class="dim"> · STREAK </tspan><tspan class="hot">17 DAYS</tspan></text>
    <text class="led dim right" x="1136" y="356">UPDATED 1:55 AM ET</text>

    <!-- platform edge and track -->
    <rect x="0" y="378" width="1200" height="50" fill="#070707"/>
    <rect x="0" y="378" width="1200" height="4" fill="#fccc0a"/>
    <rect x="0" y="422" width="1200" height="2" fill="#2b2b2b"/>

    <g clip-path="url(#tunnel)">
      <g class="train">
        <g id="car">
          <rect x="0" y="388" width="146" height="32" rx="5" fill="#c4c8cc"/>
          <rect x="0" y="410" width="146" height="4" fill="#0039a6"/>
          <rect x="10" y="393" width="26" height="12" rx="2" fill="#11181f"/>
          <rect x="110" y="393" width="26" height="12" rx="2" fill="#11181f"/>
          <rect class="doors" x="46" y="392" width="54" height="22" rx="2" fill="#8d9399"/>
          <rect x="72" y="392" width="2" height="22" fill="#5d6268"/>
          <circle cx="26" cy="422" r="4" fill="#3a3a3a"/><circle cx="120" cy="422" r="4" fill="#3a3a3a"/>
        </g>
        <use href="#car" x="152"/>
        <use href="#car" x="304"/>
        <use href="#car" x="456"/>
        <rect x="590" y="395" width="8" height="5" rx="1" fill="#fff6c9"/>
      </g>
    </g>
  </g>
</svg>
